<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Путь героя — фан-справочник</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;700&display=swap" rel="stylesheet">

<style>
/* --- СТИЛИ БЕЗ ИЗМЕНЕНИЙ --- */
:root{
  --bg:#05070a;
  --card:#0b1220;
  --border:#1e88ff;
  --accent:#ff9800;
  --text:#e8f0ff;
  --muted:#9fb4d8;
  --locked: rgba(255,255,255,0.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#0a1020,#05070a 60%);
  color:var(--text);
  font-family:system-ui,Arial,sans-serif;
  font-weight:700;
}
header{
  border-bottom:3px solid var(--border);
  padding:18px;
  text-align:center;
}
header h1{
  font-family:'Press Start 2P';
  color:var(--accent);
  font-size:18px;
}
.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tab{
  font-family:'Press Start 2P';
  border:2px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
}
.tab.active{color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{
  border:2px solid var(--border);
  background:linear-gradient(180deg,#0d162a,var(--card));
  border-radius:14px;
  padding:14px;
}
.card h3{
  font-family:'Press Start 2P';
  font-size:12px;
  color:var(--accent);
}
.world{font-size:12px;color:var(--muted)}
.stat{font-size:13px}
.fan-desc{font-size:12px;color:#b9d8ff;margin-top:6px}
main{max-width:1100px;margin:auto;padding:16px}
</style>
</head>

<body>

<header>
  <h1>Путь героя — фан-справочник</h1>
  <div class="tabs">
    <button class="tab active" data-tab="mobs">Мобы</button>
    <button class="tab" data-tab="items">Предметы</button>
    <button class="tab" data-tab="prestige">Престиж</button>
    <button class="tab" data-tab="achievements">Достижения</button>
  </div>
</header>

<main>

<section id="tab-mobs" class="tab-content active">
  <div id="cards" class="grid"></div>
</section>

<section id="tab-items" class="tab-content">
  <p>Предметы (без изменений)</p>
</section>

<section id="tab-prestige" class="tab-content">
  <p>Престиж (без изменений)</p>
</section>

<section id="tab-achievements" class="tab-content">
  <p>Достижения (без изменений)</p>
</section>

</main>

/* ================== РЕНДЕР ================== */

const cards = document.getElementById('cards');

enemies.forEach(e=>{
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `
    <h3>${e.order}. ${e.name}</h3>
    <div class="world">${e.world}</div>
    ${e.drops.map(x=>`<div class="stat">• ${x}</div>`).join('')}
    <div class="fan-desc">${e.fan}</div>
  `;
  cards.appendChild(d);
});

/* вкладки */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tab,.tab-content').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  }
});
</script>

</body>
</html>
